
name: Update YouTube Videos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_PLAYLIST_ID: PLpSvmeL1f95wgDv-wDC9G1w_axX6ab3f4
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          key = os.environ["YOUTUBE_API_KEY"]
          playlist_id = os.environ["YOUTUBE_PLAYLIST_ID"]

          def api(endpoint, params):
              params["key"] = key
              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + endpoint + "?"
                  + urllib.parse.urlencode(params)
              )
              with urllib.request.urlopen(url, timeout=30) as response:
                  return json.load(response)

          videos = []
          page_token = None

          for _ in range(2):
              params = {
                  "part": "snippet,contentDetails",
                  "playlistId": playlist_id,
                  "maxResults": 50
              }
              if page_token:
                  params["pageToken"] = page_token

              data = api("playlistItems", params)

              for item in data.get("items", []):
                  snippet = item["snippet"]
                  video_id = item["contentDetails"].get("videoId")
                  if not video_id:
                      continue

                  thumbnails = snippet.get("thumbnails", {})
                  thumbnail = (
                      thumbnails.get("maxres")
                      or thumbnails.get("standard")
                      or thumbnails.get("high")
                      or thumbnails.get("medium")
                      or thumbnails.get("default")
                      or {}
                  ).get(
                      "url",
                      f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg"
                  )

                  videos.append({
                      "id": video_id,
                      "title": snippet["title"],
                      "url": f"https://www.youtube.com/watch?v={video_id}",
                      "thumbnail": thumbnail,
                      "published": item["contentDetails"].get(
                          "videoPublishedAt",
                          snippet.get("publishedAt", "")
                      )
                  })

              page_token = data.get("nextPageToken")
              if not page_token:
                  break

          videos.sort(
              key=lambda video: video["published"],
              reverse=True
          )

          with open("videos.json", "w", encoding="utf-8") as file:
              json.dump(videos[:10], file, ensure_ascii=False, indent=2)
              file.write("\n")

          print(f"{len(videos[:10])}本の動画を取得しました")
          PY


      
      - name: Commit updated videos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          git add videos.json

          if git diff --cached --quiet; then
            echo "動画情報に変更はありません"
            exit 0
          fi

          git commit -m "Update YouTube videos"
          git push origin main
